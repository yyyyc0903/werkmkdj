    <style>
        body {

            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }
        h1 {
            color: #ffcc00;
            margin-bottom: 5px;
        }
        #status-bar {
            background-color: #2b2b40;
            padding: 15px 25px;
            border-radius: 8px;
            display: flex;
            gap: 20px;
            font-size: 1.1rem;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        #game-container {
            background-color: #2b2b40;
            width: 100%;

            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 6px 12px rgba(0,0,0,0.4);
        }
        #console-log {
            background-color: #12121c;
            height: 180px;
            border-radius: 6px;
            padding: 15px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 1rem;
            color: #a6e3a1;
            margin-bottom: 20px;
            border: 1px solid #444;
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        button {
            background-color: #4f46e5;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.2s;
            text-align: left;
        }
        button:hover {
            background-color: #4338ca;
        }
        button.bad {
            background-color: #dc2626;
        }
        button.bad:hover {
            background-color: #b91c1c;
        }
    </style>
</head>

    </div>
