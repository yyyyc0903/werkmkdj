<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wordle 猜單字小遊戲</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121213;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        h1 {
            margin: 10px 0;
            font-size: 2rem;
            letter-spacing: 2px;
        }
        #board {
            display: grid;
            grid-template-rows: repeat(6, 1fr);
            grid-gap: 5px;
            margin-bottom: 20px;
        }
        .row {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-gap: 5px;
        }
        .tile {
            width: 50px;
            height: 50px;
            border: 2px solid #3a3a3c;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5rem;
            font-weight: bold;
            text-transform: uppercase;
            user-select: none;
            transition: background-color 0.3s;
        }
        .tile.correct { background-color: #538d4e; border-color: #538d4e; }
        .tile.present { background-color: #b59f3b; border-color: #b59f3b; }
        .tile.absent { background-color: #3a3a3c; border-color: #3a3a3c; }
        
        #keyboard {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .keyboard-row {
            display: flex;
            justify-content: center;
            gap: 6px;
        }
        .key {
            background-color: #818384;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 12px 10px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
        }
        .key.wide {
            padding: 12px 15px;
        }
        #message {
            margin-top: 15px;
            height: 24px;
            font-size: 1.1rem;
            font-weight: bold;
        }
        #restart-btn {
            margin-top: 15px;
            padding: 10px 20px;
            background-color: #538d4e;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            cursor: pointer;
            display: none;
        }
        #restart-btn:hover {
            background-color: #42723d;
        }
    </style>
</head>
<body>

    <h1>WORDLE</h1>
    <div id="board"></div>
    <div id="message"></div>
    <div id="keyboard"></div>
    <button id="restart-btn" onclick="initGame()">再玩一次</button>

    <script>
        const WORDS = ["APPLE", "BEACH", "CHAIR", "DRIVE", "EARLY", "FIELD", "GREAT", "HOUSE", "IMAGE", "JUICE"];
        let secretWord = "";
        let currentRow = 0;
        let currentCol = 0;
        let boardState = Array(6).fill().map(() => Array(5).fill(""));
        let gameOver = false;

        const boardEl = document.getElementById("board");
        const messageEl = document.getElementById("message");
        const restartBtn = document.getElementById("restart-btn");
        const keyboardEl = document.getElementById("keyboard");

        function initGame() {
            secretWord = WORDS[Math.floor(Math.random() * WORDS.length)];
            currentRow = 0;
            currentCol = 0;
            boardState = Array(6).fill().map(() => Array(5).fill(""));
            gameOver = false;
            messageEl.textContent = "";
            restartBtn.style.display = "none";
            
            buildBoard();
            buildKeyboard();
        }

        function buildBoard() {
            boardEl.innerHTML = "";
            for (let r = 0; r < 6; r++) {
                const rowEl = document.createElement("div");
                rowEl.classList.add("row");
                for (let c = 0; c < 5; c++) {
                    const tileEl = document.createElement("div");
                    tileEl.classList.add("tile");
                    tileEl.id = `tile-${r}-${c}`;
                    rowEl.appendChild(tileEl);
                }
                boardEl.appendChild(rowEl);
            }
        }

        function buildKeyboard() {
            keyboardEl.innerHTML = "";
            const keys = [
                ["Q", "W", "E", "R", "T", "Y", "U", "I", "O", "P"],
                ["A", "S", "D", "F", "G", "H", "J", "K", "L"],
                ["ENTER", "Z", "X", "C", "V", "B", "N", "M", "DELETE"]
            ];

            keys.forEach(row => {
                const rowEl = document.createElement("div");
                rowEl.classList.add("keyboard-row");
                row.forEach(key => {
                    const keyEl = document.createElement("button");
                    keyEl.classList.add("key");
                    if (key === "ENTER" || key === "DELETE") keyEl.classList.add("wide");
                    keyEl.textContent = key;
                    keyEl.id = `key-${key}`;
                    keyEl.addEventListener("click", () => handleKeyPress(key));
                    rowEl.appendChild(keyEl);
                });
                keyboardEl.appendChild(rowEl);
            });
        }

        document.addEventListener("keydown", (e) => {
            if (gameOver) return;
            if (e.key === "Enter") {
                handleKeyPress("ENTER");
            } else if (e.key === "Backspace") {
                handleKeyPress("DELETE");
            } else {
                const letter = e.key.toUpperCase();
                if (/^[A-Z]$/.test(letter)) {
                    handleKeyPress(letter);
                }
            }
        });

        function handleKeyPress(key) {
            if (gameOver) return;

            if (key === "ENTER") {
                if (currentCol < 5) {
                    messageEl.textContent = "字母不足 5 個！";
                    return;
                }
                checkRow();
            } else if (key === "DELETE") {
                if (currentCol > 0) {
                    currentCol--;
                    boardState[currentRow][currentCol] = "";
                    updateTile(currentRow, currentCol, "");
                }
            } else {
                if (currentCol < 5) {
                    boardState[currentRow][currentCol] = key;
                    updateTile(currentRow, currentCol, key);
                    currentCol++;
                }
            }
        }

        function updateTile(row, col, letter) {
            const tile = document.getElementById(`tile-${row}-${col}`);
            tile.textContent = letter;
        }

        function checkRow() {
            const guess = boardState[currentRow].join("");
            const secretArr = secretWord.split("");
            const guessArr = boardState[currentRow];

            // 檢查顏色邏輯
            let rowColors = Array(5).fill("absent");
            
            // 先檢查正確 (Green)
            for (let i = 0; i < 5; i++) {
                if (guessArr[i] === secretArr[i]) {
                    rowColors[i] = "correct";
                    secretArr[i] = null;
                    guessArr[i] = null;
                }
            }

            // 再檢查存在但位置錯誤 (Yellow)
            for (let i = 0; i < 5; i++) {
                if (guessArr[i] !== null) {
                    const index = secretArr.indexOf(guessArr[i]);
                    if (index !== -1) {
                        rowColors[i] = "present";
                        secretArr[index] = null;
                    }
                }
            }

            // 套用顏色到畫面
            for (let i = 0; i < 5; i++) {
                const tile = document.getElementById(`tile-${currentRow}-${i}`);
                tile.classList.add(rowColors[i]);
            }

            if (guess === secretWord) {
                messageEl.textContent = "恭喜你，猜中了！ 🎉";
                gameOver = true;
                restartBtn.style.display = "block";
                return;
            }

            currentRow++;
            currentCol = 0;

            if (currentRow === 6) {
                messageEl.textContent = `遊戲結束！正確單字是：${secretWord}`;
                gameOver = true;
                restartBtn.style.display = "block";
            }
        }

        // 初始化遊戲
        initGame();
    </script>
</body>
</html>
